name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@12  # match the npm that writes package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Lighthouse (95+ accessibility, best practices, SEO; performance warns below 90)
        run: CHROME_PATH=$(node -e 'console.log(require("@playwright/test").chromium.executablePath())') npx lhci autorun
