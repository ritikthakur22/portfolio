<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Ritik Thakur, Software Developer">
  <style>
    .bg { fill: #0b0d0e; }
    .name { font: 800 108px "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -5px; fill: #e8ecea; }
    .accent { fill: #2dd4bf; }
    .role { font: 500 30px "Segoe UI", Helvetica, Arial, sans-serif; fill: #8e9996; opacity: 0; }
    .mono { font: 500 18px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #8e9996; }
    .rise { opacity: 0; animation: rise 1s cubic-bezier(.16,1,.3,1) forwards; }
    .rise.d2 { animation-delay: .15s; }
    .line { stroke: #2dd4bf; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.2s .6s cubic-bezier(.65,0,.35,1) forwards; }
    .r1 { animation: cycle 9s 1s infinite; }
    .r2 { animation: cycle 9s 4s infinite; }
    .r3 { animation: cycle 9s 7s infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .glow { animation: drift 12s ease-in-out infinite alternate; }
    .lids { transform-origin: 1040px 168px; transform-box: view-box; animation: lids 4s infinite; }
    .pupils { animation: look 6s ease-in-out infinite; }
    .bot { animation: float 3.2s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes cycle { 0%, 100% { opacity: 0; } 4%, 30% { opacity: 1; } 34% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-260px, 40px); } }
    @keyframes lids { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes look { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-4px, 1px); } 50% { transform: translate(3px, -2px); } 75% { transform: translate(-2px, 3px); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise, .r1 { opacity: 1; } .line { stroke-dashoffset: 0; } }
  </style>
  <defs>
    <radialGradient id="g"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  </defs>
  <rect class="bg" width="1200" height="360" rx="24"/>
  <circle class="glow" cx="900" cy="120" r="320" fill="url(#g)"/>
  <text x="64" y="72" class="mono">RT<tspan class="accent">.</tspan>  ritikthakur.com.np</text>
  <text x="58" y="198" class="name rise">RITIK <tspan class="accent">THAKUR</tspan></text>
  <line class="line" x1="64" y1="226" x2="584" y2="226"/>
  <text x="64" y="282" class="role r1">Software Developer, web and mobile apps</text>
  <text x="64" y="282" class="role r2">React · Next.js · React Native · FastAPI · NestJS</text>
  <text x="64" y="282" class="role r3">Three apps live on Google Play</text>
  <rect class="cursor accent" x="64" y="300" width="14" height="4"/>
  <g class="bot">
    <path class="accent" d="M1040 100c-46 0-84 35-84 78 0 22 10 42 26 56l-8 33 37-18c9 3 19 5 29 5 46 0 84-35 84-78s-38-76-84-76z"/>
    <g class="lids">
      <ellipse cx="1013" cy="168" rx="21" ry="24" fill="#0b0d0e"/>
      <ellipse cx="1067" cy="168" rx="21" ry="24" fill="#0b0d0e"/>
      <g class="pupils">
        <circle cx="1013" cy="168" r="10" class="accent"/>
        <circle cx="1067" cy="168" r="10" class="accent"/>
      </g>
    </g>
  </g>
</svg>
